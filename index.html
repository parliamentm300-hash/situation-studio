const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function openDB(){return new Promise((resolve,reject)=>{let q=indexedDB.open('situation-studio-v1',1);q.onupgradeneeded=()=>{let d=q.result;if(!d.objectStoreNames.contains('data'))d.createObjectStore('data');if(!d.objectStoreNames.contains('images'))d.createObjectStore('images')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function req(q){return new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function persist(){await req(tx('data','readwrite').put(state,'state'))}
async function addImage(file){let id=uid();await req(tx('images','readwrite').put(file,id));return id}
async function imageBlob(id){return req(tx('images').get(id))}
async function removeImage(id){await req(tx('images','readwrite').delete(id))}
async function save(){await persist();render();toast('保存しました')}
function options(list,selected){return list.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}

function selectedOutfit(){return draft.outfitFree.trim()||`${draft.genre}系・${draft.design}${draft.design.includes('ジーンズ')||draft.design.includes('パンツ')||draft.design==='浴衣'?'':`（スカート丈：${draft.length}）`}`}
function buildPrompt(){let cs=state.characters.filter(x=>draft.characterIds.includes(x.id));let lines=['【シチュエーション作成依頼】',`作成モード：${{auto:'GPTおまかせ',detail:'詳細指定',hybrid:'ハイブリッド'}[draft.mode]}`,`登場人物：${cs.length?cs.map(x=>x.name).join('、'):'自由指定'}`];for(let c of cs)if(c.profile)lines.push(`【${c.name}の固定設定】\n${c.profile}`);lines.push(`衣装：${selectedOutfit()}`,`場所：${draft.location||'おまかせ'}`,`ジャンル：${draft.event}`,`展開案：${draft.selectedIdea||'未指定'}`);if(draft.detail.trim())lines.push(`指定内容：\n${draft.detail.trim()}`);lines.push(draft.mode==='auto'?'指定条件を守り、自然な展開を自由に考えて、画像生成用シチュエーションの詳細な全文を提示してください。':draft.mode==='detail'?'指定した展開・順序・条件を変更せず、未指定部分のみ自然に補完して、画像生成用シチュエーションの詳細な全文を提示してください。':'重要な指定条件を守り、未指定の展開・動作・構図を自然に補完して、画像生成用シチュエーションの詳細な全文を提示してください。');lines.push('まず確認用の全文を提示し、明示的な承認があるまで画像生成しないでください。');if(draft.addTemplates){let t=state.templates.filter(x=>x.on);if(t.length)lines.push('【共通補足】\n'+t.map(x=>x.body).join('\n'))}return lines.join('\n\n')}
function renderCreate(){let ideas=[...BUILT_IN,...state.customIdeas].filter(x=>x.genre===draft.event);let ranked=ideas.map((x,i)=>({...x,score:(x.tags||[]).includes('衣装')?2:0})).sort((a,b)=>b.score-a.score);let shown=Array.from({length:Math.min(5,ranked.length)},(_,i)=>ranked[(ideasOffset+i)%ranked.length]);$('app').innerHTML=`<section class="panel"><h2>シチュエーション作成</h2><label>作成モード</label><select id="mode">${[['auto','GPTおまかせ'],['detail','詳細指定'],['hybrid','ハイブリッド']].map(([v,n])=>`<option value="${v}" ${v===draft.mode?'selected':''}>${n}</option>`).join('')}</select><label>登場人物（複数選択可・未選択でも可）</label>${state.characters.length?state.characters.map(c=>`<label class="check"><input type="checkbox" class="charPick" value="${c.id}" ${draft.characterIds.includes(c.id)?'checked':''}>${esc(c.name)}</label>`).join(''):'<p class="hint">キャラタブで登録できます。未登録でも作成可能。</p>'}<div class="grid"><div><label>衣装ジャンル</label><select id="genre">${options(genres,draft.genre)}</select></div><div><label>衣装デザイン</label><select id="design">${options(outfitIdeas[draft.genre]||['自由入力'],draft.design)}</select></div><div><label>スカート丈（該当時のみ）</label><select id="length">${options(['ショート丈','膝丈','ロング丈'],draft.length)}</select></div><div><label>場所</label><input id="location" value="${esc(draft.location)}"></div><div><label>展開ジャンル</label><select id="event">${options([...new Set([...BUILT_IN.map(x=>x.genre),...state.customIdeas.map(x=>x.genre)])],draft.event)}</select></div></div><label>衣装の自由指定（入力するとこちらを優先）</label><input id="outfitFree" placeholder="例：白いブラウスとワイドジーンズ" value="${esc(draft.outfitFree)}"><div class="row" style="justify-content:space-between;align-items:center;margin-top:12px"><label style="margin:0" for="detail">自分で指定する展開・動作・セリフ</label><button type="button" class="warn" id="clearDetail" style="padding:7px 12px;font-size:13px">クリア</button></div><textarea id="detail" placeholder="自由入力。空欄でもOK">${esc(draft.detail)}</textarea><label class="check"><input type="checkbox" id="addTemplates" ${draft.addTemplates?'checked':''}>共通補足テンプレートを自動追加</label></section><section class="panel"><h2>展開候補 <small>登録済み100種類＋追加分</small></h2><div id="ideas">${shown.map(x=>`<div class="card"><p>${esc(x.text)}</p><button class="alt pickIdea" data-id="${esc(x.id)}">この展開を使う</button></div>`).join('')}</div><div class="row"><button id="nextIdeas" class="alt">別案を出す</button><button id="addIdea" class="alt">自分の展開を登録</button></div><p class="hint">候補は登録済みのパターンから表示します。新しい展開の詳細はGPTで作成します。</p></section><section class="panel"><h2>GPTに渡す指示文</h2><pre class="output" id="prompt"></pre><div class="row"><button id="copyPrompt">全文をコピー</button><button id="savePrompt" class="alt">下書きを成功例へ保存</button></div></section>`;
function sync(){for(let k of ['mode','genre','design','length','location','event','outfitFree','detail'])draft[k]=$(k).value;draft.characterIds=[...document.querySelectorAll('.charPick:checked')].map(x=>x.value);draft.addTemplates=$('addTemplates').checked;$('prompt').textContent=buildPrompt()}
for(let k of ['mode','genre','design','length','location','event','outfitFree','detail','addTemplates'])$(k).addEventListener('input',()=>{let old=draft.genre;sync();if(k==='genre'){draft.design=outfitIdeas[draft.genre][0];renderCreate()}else if(k==='event'){ideasOffset=0;renderCreate()}});$('clearDetail').onclick=()=>{if(!$('detail').value)return;$('detail').value='';draft.detail='';sync();toast('詳細入力欄をクリアしました')};document.querySelectorAll('.charPick').forEach(x=>x.onchange=sync);document.querySelectorAll('.pickIdea').forEach(b=>b.onclick=()=>{draft.selectedIdea=[...BUILT_IN,...state.customIdeas].find(x=>x.id===b.dataset.id)?.text||'';sync();$('prompt').textContent=buildPrompt();toast('展開を反映しました')});$('nextIdeas').onclick=()=>{sync();ideasOffset=(ideasOffset+5)%Math.max(1,ranked.length);renderCreate()};$('addIdea').onclick=async()=>{sync();let text=prompt('登録する展開案');if(!text?.trim())return;state.customIdeas.push({id:uid(),genre:draft.event,text:text.trim(),tags:[]});await save()};$('copyPrompt').onclick=async()=>{sync();await copyText(buildPrompt())};$('savePrompt').onclick=async()=>{sync();state.scenarios.push({id:uid(),title:'下書き '+new Date().toLocaleDateString('ja-JP'),body:buildPrompt(),tags:'下書き',favorite:false});await save()};sync()}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('コピーしました')}catch{let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('コピーしました')}}
function renderCharacters(){ $('app').innerHTML=`<section class="panel"><h2>キャラクター登録</h2><label>名前</label><input id="charName" placeholder="例：さき"><label>固定設定（全文を貼り付け可）</label><textarea id="charProfile" placeholder="外見・髪型・体格・衣装など"></textarea><button id="charAdd">登録する</button></section><section class="panel"><h2>登録済みキャラクター</h2>${state.characters.length?state.characters.map(c=>`<div class="card"><b>${esc(c.name)}</b><p>${esc(c.profile)}</p><div class="row"><button class="alt editChar" data-id="${c.id}">編集</button><button class="warn delChar" data-id="${c.id}">削除</button></div></div>`).join(''):'<div class="empty">まだ登録がありません</div>'}</section>`;$('charAdd').onclick=async()=>{let name=$('charName').value.trim();if(!name)return toast('名前を入力してください');state.characters.push({id:uid(),name,profile:$('charProfile').value});await save()};document.querySelectorAll('.editChar').forEach(b=>b.onclick=async()=>{let c=state.characters.find(x=>x.id===b.dataset.id);let n=prompt('名前',c.name);if(n===null||!n.trim())return;let p=prompt('固定設定',c.profile);if(p===null)return;c.name=n;c.profile=p;await save()});document.querySelectorAll('.delChar').forEach(b=>b.onclick=async()=>{if(!confirm('削除しますか？'))return;state.characters=state.characters.filter(x=>x.id!==b.dataset.id);await save()})}
function renderOutfits(){$('app').innerHTML=`<section class="panel"><h2>衣装を保存</h2><label>衣装名</label><input id="outfitName" placeholder="例：白ブラウス＋ワイドジーンズ"><label>ジャンル</label><select id="outfitGenre">${options(genres,'カジュアル')}</select><label>詳細設定</label><textarea id="outfitText" placeholder="色、素材、丈、インナーなど"></textarea><button id="outfitAdd">衣装を保存</button></section><section class="panel"><h2>マイ衣装</h2>${state.outfits.map(o=>`<div class="card"><b>${esc(o.name)}</b><span class="pill">${esc(o.genre)}</span><p>${esc(o.text)}</p><div class="row"><button class="alt useOutfit" data-id="${o.id}">シチュ作成で使う</button><button class="warn delOutfit" data-id="${o.id}">削除</button></div></div>`).join('')||'<div class="empty">登録した衣装がここに表示されます</div>'}</section>`;$('outfitAdd').onclick=async()=>{if(!$('outfitName').value.trim())return toast('衣装名を入力してください');state.outfits.push({id:uid(),name:$('outfitName').value.trim(),genre:$('outfitGenre').value,text:$('outfitText').value});await save()};document.querySelectorAll('.useOutfit').forEach(b=>b.onclick=()=>{let o=state.outfits.find(x=>x.id===b.dataset.id);draft.outfitFree=o.name+(o.text?'。'+o.text:'');tab='create';render()});document.querySelectorAll('.delOutfit').forEach(b=>b.onclick=async()=>{if(!confirm('削除しますか？'))return;state.outfits=state.outfits.filter(x=>x.id!==b.dataset.id);await save()})}
function renderScenarios(){let filter=window.scenarioFilter||'';let list=state.scenarios.filter(s=>(s.title+' '+s.body+' '+s.tags).includes(filter));$('app').innerHTML=`<section class="panel"><h2>成功例・全文保存</h2><label>タイトル</label><input id="scTitle" placeholder="例：公園のダンス練習"><label>シチュエーション全文（原文のまま保存）</label><textarea id="scBody" style="min-height:170px" placeholder="ChatGPTからコピーした全文を貼り付け"></textarea><label>タグ（カンマ区切り）</label><input id="scTags" placeholder="例：ダンス, ハプニング"><button id="scAdd">全文を保存</button></section><section class="panel"><h2>保存した全文（${state.scenarios.length}件）</h2><input id="scSearch" placeholder="タイトル・本文・タグで検索" value="${esc(filter)}">${list.map(s=>`<div class="card"><b>${esc(s.title)}</b> ${s.favorite?'★':''}<p class="hint">${esc(s.tags)}</p><details><summary>全文を表示</summary><pre class="output">${esc(s.body)}</pre></details><div class="row"><button class="alt copySc" data-id="${s.id}">全文コピー</button><button class="alt dupSc" data-id="${s.id}">複製</button><button class="alt favSc" data-id="${s.id}">${s.favorite?'★解除':'☆お気に入り'}</button><button class="alt editSc" data-id="${s.id}">編集</button><button class="warn delSc" data-id="${s.id}">削除</button></div></div>`).join('')||'<div class="empty">該当する全文はありません</div>'}</section>`;$('scAdd').onclick=async()=>{let body=$('scBody').value.trim();if(!body)return toast('全文を入力してください');state.scenarios.push({id:uid(),title:$('scTitle').value.trim()||'無題',body,tags:$('scTags').value,favorite:false});await save()};$('scSearch').oninput=e=>{window.scenarioFilter=e.target.value;renderScenarios();$('scSearch').focus();$('scSearch').setSelectionRange(filter.length+1,filter.length+1)};for(let op of ['copySc','dupSc','favSc','editSc','delSc'])document.querySelectorAll('.'+op).forEach(b=>b.onclick=async()=>{let s=state.scenarios.find(x=>x.id===b.dataset.id);if(op==='copySc')return copyText(s.body);if(op==='dupSc')state.scenarios.push({...s,id:uid(),title:s.title+'（コピー）'});if(op==='favSc')s.favorite=!s.favorite;if(op==='editSc'){let n=prompt('タイトル',s.title);if(n===null)return;let body=prompt('全文',s.body);if(body===null)return;s.title=n;s.body=body}if(op==='delSc'){if(!confirm('削除しますか？'))return;state.scenarios=state.scenarios.filter(x=>x.id!==s.id)}await save()})}
function renderTemplates(){$('app').innerHTML=`<section class="panel"><h2>共通補足テンプレート</h2><p class="hint">ONの補足を、GPTに渡す全文の末尾に追加します。保存済みの成功例は書き換えません。</p>${state.templates.map(t=>`<div class="card"><label class="check"><input type="checkbox" class="toggleT" data-id="${t.id}" ${t.on?'checked':''}><b>${esc(t.name)}</b></label><p>${esc(t.body)}</p><div class="row"><button class="alt editT" data-id="${t.id}">編集</button><button class="warn delT" data-id="${t.id}">削除</button></div></div>`).join('')}<h3>新しい補足を追加</h3><label>名前</label><input id="tName"><label>補足全文</label><textarea id="tBody"></textarea><button id="addT">追加する</button></section>`;$('addT').onclick=async()=>{if(!$('tName').value.trim()||!$('tBody').value.trim())return toast('名前と本文を入力してください');state.templates.push({id:uid(),name:$('tName').value.trim(),body:$('tBody').value.trim(),on:true});await save()};document.querySelectorAll('.toggleT').forEach(b=>b.onchange=async()=>{state.templates.find(x=>x.id===b.dataset.id).on=b.checked;await persist();toast('設定を保存しました')});document.querySelectorAll('.editT').forEach(b=>b.onclick=async()=>{let t=state.templates.find(x=>x.id===b.dataset.id);let n=prompt('名前',t.name);if(n===null)return;let body=prompt('補足全文',t.body);if(body===null)return;t.name=n;t.body=body;await save()});document.querySelectorAll('.delT').forEach(b=>b.onclick=async()=>{if(!confirm('削除しますか？'))return;state.templates=state.templates.filter(x=>x.id!==b.dataset.id);await save()})}
let urls=[];function cleanupURLs(){urls.forEach(URL.revokeObjectURL);urls=[]}
async function renderPhotos(){cleanupURLs();let folders=state.folders;let selected=window.photoFolder||'all';let items=state.photos.filter(x=>selected==='all'||x.folder===selected);$('app').innerHTML=`<section class="panel"><h2>画像ライブラリ</h2><p class="hint">画像は端末のブラウザ内に原画質で保存します。写真アプリからの参照ではなく、取り込み時にコピーします。</p><label>新しいフォルダ名</label><div class="row"><input id="folderName" class="grow" placeholder="例：衣装資料 / ダンスモーション"><button id="addFolder">作成</button></div><label>フォルダで絞り込み</label><select id="photoFolder"><option value="all">すべて</option><option value="">未分類</option>${folders.map(f=>`<option value="${f.id}" ${f.id===selected?'selected':''}>${esc(f.name)}</option>`).join('')}</select><label>画像を取り込む（複数可）</label><input type="file" accept="image/*" multiple id="photoFiles"><label>保存先フォルダ</label><select id="uploadFolder"><option value="">未分類</option>${folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select><label>タグ（カンマ区切り）</label><input id="uploadTags" placeholder="例：衣装, モーション, さき"><button id="upload">画像を保存</button></section><section class="panel"><h2>保存済み画像（${items.length}枚）</h2><div class="photos" id="photoGrid">${items.map(x=>`<div class="photo"><img id="img-${x.id}" alt="${esc(x.name)}"><strong>${esc(x.name)}</strong><small>${esc(x.tags||'タグなし')}</small><small>${(x.size/1024/1024).toFixed(2)} MB</small><div class="row"><button class="alt editPhoto" data-id="${x.id}">編集</button><button class="warn delPhoto" data-id="${x.id}">削除</button></div></div>`).join('')||'<div class="empty">画像がありません</div>'}</div></section>`;
$('addFolder').onclick=async()=>{let name=$('folderName').value.trim();if(!name)return;state.folders.push({id:uid(),name});await save()};$('photoFolder').value=selected;$('photoFolder').onchange=e=>{window.photoFolder=e.target.value;renderPhotos()};$('upload').onclick=async()=>{let files=[...$('photoFiles').files];if(!files.length)return toast('画像を選択してください');let folder=$('uploadFolder').value,tags=$('uploadTags').value;for(let file of files){if(!file.type.startsWith('image/'))continue;let id=await addImage(file);state.photos.push({id,name:file.name,folder,tags,size:file.size,type:file.type,created:Date.now()})}await save()};document.querySelectorAll('.editPhoto').forEach(b=>b.onclick=async()=>{let x=state.photos.find(z=>z.id===b.dataset.id);let n=prompt('画像タイトル',x.name);if(n===null)return;let tags=prompt('タグ',x.tags);if(tags===null)return;let folder=prompt('フォルダ名（空欄なら未分類）',state.folders.find(f=>f.id===x.folder)?.name||'');if(folder===null)return;x.name=n;x.tags=tags;if(folder.trim()){let f=state.folders.find(f=>f.name===folder.trim());if(!f){f={id:uid(),name:folder.trim()};state.folders.push(f)}x.folder=f.id}else x.folder='';await save()});document.querySelectorAll('.delPhoto').forEach(b=>b.onclick=async()=>{if(!confirm('この画像をアプリから削除しますか？'))return;await removeImage(b.dataset.id);state.photos=state.photos.filter(x=>x.id!==b.dataset.id);await save()});for(let x of items){let blob=await imageBlob(x.id);let el=$('img-'+x.id);if(el&&blob){let url=URL.createObjectURL(blob);urls.push(url);el.src=url}}}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
async function backup(){let images=[];for(let x of state.photos){let blob=await imageBlob(x.id);if(!blob)continue;let data=await new Promise((resolve,reject)=>{let r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)});images.push({id:x.id,data})}let json=JSON.stringify({format:'situation-studio-backup',version:1,state,images});downloadBlob(new Blob([json],{type:'application/json'}),'situation-studio-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('バックアップを作成しました')}
async function restore(file){let raw=JSON.parse(await file.text());if(raw.format!=='situation-studio-backup'||!raw.state||!Array.isArray(raw.images))throw Error('対応していないファイル');if(!confirm('現在の登録内容をバックアップで置き換えます。続行しますか？'))return;for(let p of state.photos)await removeImage(p.id);for(let x of raw.images){let blob=await(await fetch(x.data)).blob();await req(tx('images','readwrite').put(blob,x.id))}state={...structuredClone(defaults),...raw.state};await save()}
function renderBackup(){let mb=state.photos.reduce((n,x)=>n+(x.size||0),0)/1024/1024;$('app').innerHTML=`<section class="panel"><h2>データ・バックアップ</h2><p>保存済み画像：<b>${state.photos.length}枚</b> / 画像合計：約<b>${mb.toFixed(1)} MB</b></p><p class="hint">画像・キャラ・衣装・成功例・補足をまとめてJSONファイルに書き出します。容量が大きい場合、バックアップ作成に時間がかかります。</p><button id="backupBtn">バックアップを書き出す</button><label>バックアップを復元</label><input type="file" id="restoreFile" accept="application/json,.json"><button id="restoreBtn" class="alt">復元する</button><div class="line"></div><h3>iPhoneでの利用について</h3><p class="hint">HTTPSで公開するとSafariの「共有」→「ホーム画面に追加」で使えます。iPhoneではブラウザのデータ削除などで保存内容が失われる可能性があるため、バックアップを定期的に「ファイル」へ保存してください。端末間の自動同期はありません。</p></section>`;$('backupBtn').onclick=()=>backup().catch(e=>toast('バックアップ失敗：'+e.message));$('restoreBtn').onclick=async()=>{let f=$('restoreFile').files[0];if(!f)return toast('ファイルを選択してください');try{await restore(f)}catch(e){toast('復元失敗：'+e.message)}}}
(async()=>{try{db=await openDB();state=await req(tx('data').get('state'))||structuredClone(defaults);render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('app').innerHTML='<div class="panel">起動に失敗しました。Safariのプライベートブラウズ以外でお試しください。<p>'+esc(e.message)+'</p></div>'}})();
</script></body></html>
